version: "3.8"

# Azurite - Azure Storage emulator for local development.
# Start with:  docker compose -f docker-compose.azurite.yml up -d
#
# The default "UseDevelopmentStorage=true" connection string used by the API in
# Development points to this emulator using the well-known account/key.
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: arcora-azurite
    restart: unless-stopped
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose --skipApiVersionCheck"
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
      - "10002:10002" # Table
    volumes:
      - azurite-data:/data

volumes:
  azurite-data:
